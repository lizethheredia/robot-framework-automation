name: Robot Framework Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize Browser Library
        run: rfbrowser init

      - name: Run cross-browser tests in parallel
        env:
          USERNAME: ${{ secrets.RF_USERNAME }}
          PASSWORD: ${{ secrets.RF_PASSWORD }}
        run: |
          mkdir -p results/chromium results/firefox results/webkit

          pabot --processes 2 --pabotlib-port 8270 --variable BROWSER:chromium --variable HEADLESS:True \
                --outputdir results/chromium tests/web/ &
          pabot --processes 2 --pabotlib-port 8271 --variable BROWSER:firefox --variable HEADLESS:True \
                --outputdir results/firefox tests/web/ &
          pabot --processes 2 --pabotlib-port 8272 --variable BROWSER:webkit --variable HEADLESS:True \
                --outputdir results/webkit tests/web/ &

          wait

          rebot --outputdir results \
                --output output.xml \
                --log log.html \
                --report report.html \
                results/chromium/output.xml \
                results/firefox/output.xml \
                results/webkit/output.xml

          python3 libraries/ReportCleaner.py

      - name: Create index.html redirect
        if: always()
        run: |
          echo '<meta http-equiv="refresh" content="0; url=report.html">' > results/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: results/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
